name: ZHaiCode checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zhaicode
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: zhaicode_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd 'pg_isready -U zhaicode -d zhaicode_test'
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ZHAICODE_TEST_DSN: postgresql://zhaicode:test-only@localhost:5432/zhaicode_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: make install
      - run: make release
